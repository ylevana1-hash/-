<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כנס טיפול נמרץ | סקר נאמני איכות</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      padding: 15px;
      background: radial-gradient(circle at center, #1b2845 0%, #080d1a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
    }
    .container {
      width: 100%;
      max-width: 850px;
      background: #172138;
      border: 1px solid rgba(0, 186, 238, 0.3);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(0, 186, 238, 0.2);
      padding-bottom: 15px;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #00baee;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(0, 186, 238, 0.4);
    }
    .header p {
      color: #cbd5e1;
      font-size: 1rem;
      margin: 0;
    }
    
    /* קו דופק רפואי */
    .pulse-container {
      width: 100%;
      height: 35px;
      margin: 12px 0 15px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .pulse-line {
      width: 100%;
      height: 30px;
    }

    /* עיצוב מעטפת לטופס גוגל שיבטיח טעינה נכונה וברורה */
    .form-wrapper {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
    }
    iframe {
      width: 100%;
      height: 850px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>כנס טיפול נמרץ ובטיחות</h1>
      <p>אישור הגעה ובחירת תפריט / סקר נאמני איכות</p>
      
      <!-- קו דופק מוניטור רפואי -->
      <div class="pulse-container">
        <svg class="pulse-line" viewBox="0 0 500 100" preserveAspectRatio="none">
          <path d="M0,50 L180,50 L190,20 L200,80 L210,10 L225,90 L235,50 L500,50" 
                fill="none" stroke="#00baee" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- מעטפת לבנה לטופס כדי שירוה ברור וקריא על רקע כהה -->
    <div class="form-wrapper">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSck1o5p2X9bhPh5UbJoY6qhjyu4cEQQ9pYJ4U6q2RyYjrOvpQ/viewform?embedded=true">טוען...</iframe>
    </div>
  </div>

</body>
</html>
